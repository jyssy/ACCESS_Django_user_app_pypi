[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "access_django_user_admin"
version = "1.7.0"
authors = [{ name = "Jesse Lambertson", email = "jelambe@iu.edu" }]
description = "Django User Admin for ACCESS Django Apps"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0,<6.0",
    "djangorestframework>=3.14,<4.0",
    "requests>=2.31,<3.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

license = "APACHE-2.0"
license-files = ["LICEN[CS]E*"]


[tool.setuptools.package-data]
"access_django_user_admin" = [
    "templates/**/*.html",
    "templatetags/**/*",
    "static/**/*",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/access-ci-org/Operations_ACCESS_Django_User_Admin"
Issues = "https://github.com/access-ci-org/Operations_ACCESS_Django_User_Admin/issues"
